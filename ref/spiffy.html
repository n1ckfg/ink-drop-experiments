<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Watercolor</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #f7f5f0; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false });
if (!gl) {
  document.body.innerHTML = '<p style="font:14px system-ui;padding:2rem">WebGL2 is required.</p>';
  throw new Error('WebGL2 required');
}

// Renderable float targets are optional; fall back to 8-bit if absent.
const hasFloat = !!gl.getExtension('EXT_color_buffer_float');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.max(2, Math.round(window.innerWidth  * dpr));
  canvas.height = Math.max(2, Math.round(window.innerHeight * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();

// --- Droplet system ---
// 48 drops x 4 vec4s = 192 uniform vectors, inside the 224 guaranteed by WebGL2.
const MAX_DROPS = 48;
const drops = [];
let time = 0;

function randomColor() {
  // Alcohol marker palette: vivid pinks, purples, blues, oranges, teals
  const palettes = [
    [0.95, 0.15, 0.45], // magenta
    [0.35, 0.10, 0.85], // purple
    [0.05, 0.70, 0.90], // cyan
    [0.95, 0.55, 0.05], // orange
    [0.15, 0.85, 0.55], // mint
    [0.90, 0.05, 0.15], // crimson
    [0.55, 0.15, 0.80], // violet
    [0.05, 0.50, 0.75], // azure
    [0.95, 0.30, 0.20], // vermilion
    [0.20, 0.90, 0.80], // teal
    [0.85, 0.10, 0.65], // fuchsia
    [0.10, 0.35, 0.90], // indigo
  ];
  const p = palettes[Math.floor(Math.random() * palettes.length)];
  const j = () => (Math.random() - 0.5) * 0.1;
  return [
    Math.min(1, Math.max(0, p[0] + j())),
    Math.min(1, Math.max(0, p[1] + j())),
    Math.min(1, Math.max(0, p[2] + j())),
  ];
}

function spawnDroplet(x, y) {
  if (drops.length >= MAX_DROPS) {
    drops.shift();
  }
  const size = 0.008 + Math.random() * 0.035;
  drops.push({
    x: x !== undefined ? x : Math.random(),   // 0 is a legal position, don't treat it as missing
    y: y !== undefined ? y : Math.random(),
    size,
    color: randomColor(),
    birth: time,
    lifetime: 4.0 + Math.random() * 6.0,
    spreadRate: 0.003 + Math.random() * 0.008,
    bleedRate: 0.001 + Math.random() * 0.004,
    gravity: 0.002 + Math.random() * 0.006,
    viscosity: 0.3 + Math.random() * 0.7,
    wobbleFreq: 1.0 + Math.random() * 3.0,
    wobbleAmp: 0.001 + Math.random() * 0.004,
    seed: Math.random() * 90.0,               // decorrelates each drop's edge noise
  });
}

// Initial burst
for (let i = 0; i < 15; i++) {
  setTimeout(() => spawnDroplet(), i * 200);
}

// Click/touch to add droplets
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = 1.0 - (e.clientY - rect.top) / rect.height;
  for (let i = 0; i < 3; i++) {
    spawnDroplet(
      clamp01(x + (Math.random() - 0.5) * 0.05),
      clamp01(y + (Math.random() - 0.5) * 0.05)
    );
  }
});

// --- Shaders ---
// MAX_DROPS is injected from JS so the two sides can never drift apart,
// and the #define lands before the declarations that use it.
const GLSL_HEAD = '#version 300 es\nprecision highp float;\n#define MAX_DROPS ' + MAX_DROPS + '\n';

const quadVertSrc = GLSL_HEAD + `
in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const dropFragSrc = GLSL_HEAD + `
in vec2 v_uv;
out vec4 fragColor;

uniform vec2 u_resolution;
uniform float u_time;
uniform vec4 u_dropA[MAX_DROPS];   // xy position | z size      | w birth
uniform vec4 u_dropB[MAX_DROPS];   // x lifetime  | y spread    | z bleed     | w gravity
uniform vec4 u_dropC[MAX_DROPS];   // x viscosity | y wobbleFrq | z wobbleAmp | w seed
uniform vec4 u_dropD[MAX_DROPS];   // rgb colour
uniform int u_dropCount;
uniform sampler2D u_background;

// Simplex-ish 3D noise
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

float fbm(vec3 p) {
  float f = 0.0;
  f += 0.5000 * snoise(p);
  f += 0.2500 * snoise(p * 2.0);
  f += 0.1250 * snoise(p * 4.0);
  f += 0.0625 * snoise(p * 8.0);
  return f * 0.5 + 0.5;
}

void main() {
  vec2 uv = v_uv;
  float aspect = u_resolution.x / u_resolution.y;

  vec3 transmit = vec3(1.0);   // multiplicative pigment layering
  vec3 sheen = vec3(0.0);

  for (int i = 0; i < MAX_DROPS; i++) {
    if (i >= u_dropCount) break;

    vec2  dropPos = u_dropA[i].xy;
    float dropSize = u_dropA[i].z;
    float birth = u_dropA[i].w;
    float life = u_dropB[i].x;
    float spreadR = u_dropB[i].y;
    float bleedR = u_dropB[i].z;
    float grav = u_dropB[i].w;
    float visc = u_dropC[i].x;
    float wFreq = u_dropC[i].y;
    float wAmp = u_dropC[i].z;
    float seed = u_dropC[i].w;
    vec3  dropCol = u_dropD[i].rgb;

    float age = u_time - birth;
    float fade = smoothstep(0.0, 0.3, age) * smoothstep(life, life - 1.0, age);
    if (fade <= 0.0) continue;

    // Drop position with gravity and wobble
    vec2 pos = dropPos;
    pos.y -= grav * age * age * 0.5;
    pos.x += sin(age * wFreq) * wAmp * age;
    pos.y += cos(age * wFreq * 0.7) * wAmp * age * 0.3;

    // Expanding spread radius
    float radius = dropSize + spreadR * age * visc;

    // Aspect correction: stretch x by the ratio so drops stay round on a wide canvas
    vec2 dir = vec2((uv.x - pos.x) * aspect, uv.y - pos.y);
    float dist = length(dir);
    if (dist > radius * 8.0) continue;      // reject before paying for any noise

    // Noise sampled in units of the drop's own radius, so small drops are not
    // flat-shaded and large ones are not shredded.  seed keeps siblings distinct.
    vec2 nd = dir / max(radius, 1e-5);

    float edgeNoise = fbm(vec3(nd * 1.5 + seed, age * 0.35));
    float irregular = radius * (0.72 + edgeNoise * 0.56);

    // Main droplet fill with soft edges
    float core = smoothstep(irregular, irregular * 0.35, dist);

    // Bleed halo - alcohol marker style wide bleed
    float bleedRadius = radius * (2.0 + bleedR * age * 10.0);
    float bleed = smoothstep(bleedRadius, bleedRadius * 0.1, dist) * 0.30;

    // Capillary action tendrils
    float tendrilNoise = snoise(vec3(nd * 2.2 + seed * 1.7, age * 0.3));
    float tendril = smoothstep(0.15, 0.65, tendrilNoise) * 0.35;
    tendril *= smoothstep(irregular * 1.9, irregular * 0.6, dist);

    // Pigment pooling: a ring of extra density riding the rim, not a flat step
    float ring = exp(-pow((dist - irregular) / max(irregular * 0.20, 1e-5), 2.0));

    // Granulation across the wash
    float mottle = fbm(vec3(nd * 1.1 + seed * 3.1, age * 0.2));

    float density = (core + bleed + tendril + ring * 0.55) * fade * (0.78 + mottle * 0.44);

    // Beer-Lambert: ink transmitting dropCol absorbs (1 - dropCol).  Layers multiply,
    // so overlaps genuinely deepen instead of the newest drop replacing the old one.
    transmit *= exp(-density * (1.0 - dropCol) * 1.9);

    // Wet specular highlight on fresh drops, drying off over the first second
    float wet = clamp(1.0 - age * 1.6, 0.0, 1.0);
    if (wet > 0.0) {
      vec2 sp = nd - vec2(-0.28, 0.30);
      sheen += vec3(1.0, 0.99, 0.97) * exp(-dot(sp, sp) * 6.0)
             * smoothstep(0.05, 0.5, core) * wet * 0.5;
    }
  }

  // Blurred paper, tinted by everything the pigment lets through
  vec3 paperColor = texture(u_background, uv).rgb;
  vec3 color = paperColor * transmit + sheen;

  // Subtle vignette
  float vig = 1.0 - length((uv - 0.5) * 1.2);
  color *= smoothstep(0.0, 0.7, vig) * 0.12 + 0.88;

  fragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
}`;

// Cold-press paper.  Rendered once, then blurred - a flat white fill would have
// made the two blur passes a no-op.
const paperFragSrc = GLSL_HEAD + `
in vec2 v_uv;
out vec4 fragColor;
uniform vec2 u_resolution;

float h21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), u.x),
             mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), u.x), u.y);
}
float pfbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.13; a *= 0.5; }
  return s;
}

void main() {
  vec2 q = vec2(v_uv.x * u_resolution.x / u_resolution.y, v_uv.y);
  float fine = pfbm(q * 190.0);
  float coarse = pfbm(q * 9.0 + 5.0);
  vec3 paper = vec3(0.990, 0.984, 0.972);
  paper *= 0.955 + fine * 0.058 + (coarse - 0.5) * 0.030;
  fragColor = vec4(paper, 1.0);
}`;

const blurFragSrc = GLSL_HEAD + `
in vec2 v_uv;
out vec4 fragColor;
uniform sampler2D u_tex;
uniform vec2 u_direction;
uniform vec2 u_resolution;
void main() {
  vec2 px = u_direction / u_resolution;
  vec4 result = vec4(0.0);
  result += texture(u_tex, v_uv - px * 4.0) * 0.0162;
  result += texture(u_tex, v_uv - px * 3.0) * 0.0540;
  result += texture(u_tex, v_uv - px * 2.0) * 0.1216;
  result += texture(u_tex, v_uv - px * 1.0) * 0.1945;
  result += texture(u_tex, v_uv) * 0.2270;
  result += texture(u_tex, v_uv + px * 1.0) * 0.1945;
  result += texture(u_tex, v_uv + px * 2.0) * 0.1216;
  result += texture(u_tex, v_uv + px * 3.0) * 0.0540;
  result += texture(u_tex, v_uv + px * 4.0) * 0.0162;
  fragColor = result;
}`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    // Fail loudly: a silent console.error left the page rendering blank white.
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, 'a_pos');   // one VAO serves every program
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  return p;
}

const dropProg  = createProgram(quadVertSrc, dropFragSrc);
const blurProg  = createProgram(quadVertSrc, blurFragSrc);
const paperProg = createProgram(quadVertSrc, paperFragSrc);

// Fullscreen quad
const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Framebuffers
function createFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, hasFloat ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA,
                hasFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
    throw new Error('incomplete framebuffer');
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, tex, w, h };
}

function destroyFBO(f) {
  if (!f) return;
  gl.deleteTexture(f.tex);
  gl.deleteFramebuffer(f.fb);
}

// The paper never changes, so build it once here instead of re-blurring a
// static image three times every frame.
let fboA, fboB;
function initFBOs() {
  destroyFBO(fboA); destroyFBO(fboB);
  const w = canvas.width, h = canvas.height;
  fboA = createFBO(w, h);
  fboB = createFBO(w, h);

  gl.bindVertexArray(vao);

  // Pass 1: paper fibres
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb);
  gl.viewport(0, 0, w, h);
  gl.useProgram(paperProg);
  gl.uniform2f(gl.getUniformLocation(paperProg, 'u_resolution'), w, h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Pass 2: horizontal blur
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboB.fb);
  gl.useProgram(blurProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
  gl.uniform1i(ub.u_tex, 0);
  gl.uniform2f(ub.u_resolution, w, h);
  gl.uniform2f(ub.u_direction, 1, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Pass 3: vertical blur, landing back in fboA as the finished paper
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb);
  gl.bindTexture(gl.TEXTURE_2D, fboB.tex);
  gl.uniform2f(ub.u_direction, 0, 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
}

// Uniform locations
const u = {};
['u_resolution','u_time','u_dropA','u_dropB','u_dropC','u_dropD',
 'u_dropCount','u_background'].forEach(n => u[n] = gl.getUniformLocation(dropProg, n));

const ub = {};
['u_tex','u_direction','u_resolution'].forEach(n => ub[n] = gl.getUniformLocation(blurProg, n));

initFBOs();
// One listener, not two - and the old targets are released before new ones land.
window.addEventListener('resize', () => { resize(); initFBOs(); });

// Drop data, packed into vec4s.  Eleven separate scalar arrays needed ~660
// uniform vectors; drivers only guarantee 224.
const dropA = new Float32Array(MAX_DROPS * 4);
const dropB = new Float32Array(MAX_DROPS * 4);
const dropC = new Float32Array(MAX_DROPS * 4);
const dropD = new Float32Array(MAX_DROPS * 4);

function syncDrops() {
  const n = Math.min(drops.length, MAX_DROPS);
  for (let i = 0; i < n; i++) {
    const d = drops[i], o = i * 4;
    dropA[o] = d.x;         dropA[o+1] = d.y;          dropA[o+2] = d.size;       dropA[o+3] = d.birth;
    dropB[o] = d.lifetime;  dropB[o+1] = d.spreadRate; dropB[o+2] = d.bleedRate;  dropB[o+3] = d.gravity;
    dropC[o] = d.viscosity; dropC[o+1] = d.wobbleFreq; dropC[o+2] = d.wobbleAmp;  dropC[o+3] = d.seed;
    dropD[o] = d.color[0];  dropD[o+1] = d.color[1];   dropD[o+2] = d.color[2];   dropD[o+3] = 1;
  }
  return n;
}

// Auto-spawn droplets over time
let autoSpawnTimer = 0;
let lastTs = 0;

function render(ts) {
  ts /= 1000;
  const dt = lastTs ? Math.min(ts - lastTs, 0.05) : 1 / 60;   // real clock, not a fixed 1/60
  lastTs = ts;
  time += dt;
  autoSpawnTimer += dt;

  // Auto-spawn
  if (autoSpawnTimer > 0.8) {
    autoSpawnTimer = 0;
    spawnDroplet();
  }

  // Update & cull drops.  fade reaches 0 at exactly `lifetime`, so holding them
  // a second longer just burned a uniform slot on an invisible drop.
  for (let i = drops.length - 1; i >= 0; i--) {
    if (time - drops[i].birth > drops[i].lifetime) {
      drops.splice(i, 1);
    }
  }

  const count = syncDrops();

  // Single pass: drops composited straight over the prebuilt blurred paper.
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(dropProg);
  gl.bindVertexArray(vao);
  gl.uniform2f(u.u_resolution, canvas.width, canvas.height);
  gl.uniform1f(u.u_time, time);
  gl.uniform4fv(u.u_dropA, dropA);
  gl.uniform4fv(u.u_dropB, dropB);
  gl.uniform4fv(u.u_dropC, dropC);
  gl.uniform4fv(u.u_dropD, dropD);
  gl.uniform1i(u.u_dropCount, count);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
  gl.uniform1i(u.u_background, 0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
