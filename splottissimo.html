<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splottissimo — Merged Watercolor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f7f5f0; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    font: 400 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: rgba(40,32,28,.40); pointer-events: none; user-select: none;
    transition: opacity 1.6s ease 3.5s; opacity: 1;
  }
  #hint.gone { opacity: 0; }
  #stats {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    font: 400 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(40,32,28,.45); pointer-events: none; user-select: none;
    background: rgba(247,245,240,0.8); padding: 8px 12px; border-radius: 4px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click to splash · c to clear · space to pause</div>
<div id="stats"></div>
<script>
"use strict";

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: false });
if (!gl) { document.body.innerHTML = '<p style="font:14px system-ui;padding:2rem">WebGL2 is required.</p>'; throw new Error('no webgl2'); }

const MAXD = 32;          // drops per pass
const MAXR = 12;          // concentric ring slots in the shader
const BAKE_AGE = 3.5;     // seconds before an ordinary splash stamps into paper
const FADE_TIME = 40.0;   // seconds for full fade to paper white
const AUTO_SPAWN_MIN = 0.35;
const AUTO_SPAWN_MAX = 1.1;
const INITIAL_BURST = 12;

// ================================================================ colour theme
// One hue family for the whole piece.  Each palette keeps its own internal
// variation -- the relative spacing of its hues, saturations and values is
// preserved -- but the widest deviation is squeezed down to the spreads below.
// Set a spread to 0 to collapse that axis to a single value.
const THEME = {
  hue:            0.58,   // 0..1 round the wheel: 0 red, .17 yellow, .33 green, .58 blue, .78 violet
  hueSpread:      0.085,  // half-width of the hue fan the splashes fan out across
  sat:            0.80,
  satSpread:      0.13,
  val:            0.88,
  valSpread:      0.10,

  stainHueShift: -0.035,  // big washes drift just off the splash hue
  stainSat:       0.50,
  stainSatSpread: 0.10,
  stainVal:       0.68,
  stainValSpread: 0.09,

  jitterHue:      0.018,  // per-drop wobble, kept inside the family
  jitterSat:      0.06,
  jitterVal:      0.06,

  lineHueShift:   0.0,    // concentric ink lines: same family, near-black
  lineSat:        0.62,
  lineVal:        0.10,
  lineWarm:       0.035   // extra value where that ink pools
};

const RING_LIFE = 18.0;   // sketch.html: impact to fully faded
const RING_STAGGER = 2.25;
const RING_CLICK_GAP = 0.7;  // min seconds between click-spawned rings
const RING_CAP = 8;       // live rings; the spare slots let retired ones fade out
const RING_RETIRE = 1.5;  // seconds a ring takes to fade when its slot is claimed
const STAIN_MIN = 5.5;    // spiffy2.html: seconds between big falling stains
const STAIN_MAX = 10.0;
const STAIN_ALIVE = 3;

// ================================================================ shaders

const HEAD = '#version 300 es\nprecision highp float;\n#define MAXD ' + MAXD +
             '\n#define MAXR ' + MAXR + '\n#define RLIFE ' + RING_LIFE.toFixed(1) + '\n';

const COMMON = `
uniform vec2 uRes;
uniform vec4 uA[MAXD];   // xy center (uv) | z radius (y-units) | w seed
uniform vec4 uB[MAXD];   // x strength | y fragmentation | z squash | w tendril amount
uniform vec4 uC[MAXD];   // rgb ink transmission colour | a softness (big stain)
uniform int  uCount;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){
    s += a * vnoise(p);
    p = p * 2.03 + 17.13;
    a *= 0.5;
  }
  return s;
}

float fbm3(vec3 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){
    s += a * vnoise(p.xy + p.z * 0.3);
    p = p * 2.03 + vec3(17.13, 17.13, 7.31);
    a *= 0.5;
  }
  return s;
}

// Paper tooth is fixed in screen space, so every layer pools into the same fibres.
float paperTooth(vec2 uv, float asp){
  vec2 q = vec2(uv.x * asp, uv.y);
  return fbm(q * 68.0) * 0.62 + fbm(q * 11.0 + 5.0) * 0.38;
}

// Cold-press paper base color with cloud mottle
vec3 paperColor(vec2 uv, float asp){
  float cloud = fbm(vec2(uv.x * asp, uv.y) * 3.7 + 12.0);
  vec3 paper = vec3(0.988, 0.981, 0.968);
  paper *= 0.962 + paperTooth(uv, asp) * 0.052 + (cloud - 0.5) * 0.030;
  return paper;
}

// Pigment density of one drop at aspect-corrected offset p (y up).
// soft > 0.5 takes the spiffy2 path: a big, slow, tendril-free wash.
float dropDensity(vec2 p, float R, float seed, float squash, float tendril,
                  float frag, float soft, float tooth){
  p.y /= max(squash, 0.05);

  if (soft > 0.5){
    if (dot(p, p) > R * R * 4.0) return 0.0;
    vec2 sq = p / max(R, 1e-5);
    // one warp only: these cover a lot of screen, so they stay cheap
    vec2 w = vec2(fbm3(vec3(sq * 0.92, seed)), fbm3(vec3(sq * 0.92, seed + 31.7))) - 0.5;
    float d = length(sq + w * 0.44);
    float blob = 1.0 - smoothstep(0.25, 1.0, d);           // soaked body
    float ring = smoothstep(0.55, 0.95, d) * (1.0 - smoothstep(0.95, 1.42, d));
    return (blob * 0.74 + ring * 0.46) * (0.84 + 0.30 * tooth);
  }

  if (dot(p, p) > R * R * 9.0) return 0.0;

  vec2 sp = p / max(R, 1e-5);
  float ang = atan(sp.y, sp.x);
  vec2 ac = vec2(cos(ang), sin(ang));      // seamless sampling around the rim

  // domain warp -> lopsided, hand-blotted silhouette
  vec2 w = vec2(fbm3(vec3(sp * 1.55, seed)), fbm3(vec3(sp * 1.55, seed + 31.7))) - 0.5;
  float d = length(sp + w * 0.30);

  // capillary tendrils: sparse sharp fingers creeping out along the grain
  float n1 = fbm3(vec3(ac * 3.1, seed * 1.7));
  float n2 = fbm3(vec3(ac * 9.3, seed * 3.1));
  float spikes = pow(clamp(n1 * 0.78 + n2 * 0.52 - 0.34, 0.0, 1.0), 1.7) * 2.2;
  float edge = 1.0 + tendril * (0.52 * spikes + 0.12 * (n1 - 0.5));

  float body   = smoothstep(edge, edge - 0.30, d);            // solid mass
  float halo   = smoothstep(edge * 1.80, edge * 0.42, d);     // wide translucent bleed
  float ring   = exp(-pow((d - edge * 0.93) / 0.115, 2.0));   // pigment pooling at the rim
  float thread = smoothstep(edge * (1.0 + tendril * 1.05), edge * 0.98, d) * spikes;

  float dens = body * 0.86 + halo * 0.19 + ring * 0.52 + thread * 0.30;

  // fragmentation: noise carves the wash into shards that break apart at the rim
  // while the core stays intact -- the shattered look from spiffy.html
  if (frag > 0.002){
    float shard = fbm3(vec3(sp * 3.4 + seed, seed * 0.7));
    float carve = smoothstep(0.30, 0.66, shard + (1.0 - min(d, 1.0)) * 0.38);
    dens *= mix(1.0, carve, frag);
  }

  return dens * (0.82 + 0.36 * tooth);                        // granulation
}

// Beer-Lambert: ink transmitting colour col absorbs (1 - col)
vec3 pigment(float dens, vec3 col){
  return exp(-dens * (1.0 - col) * 2.35);
}

// 3x3 gaussian + a whisper of pigment separation
vec3 sampleStain(vec2 uv, sampler2D uAccum, vec2 uRes){
  vec2 px = 1.35 / uRes;
  vec3 s = texture(uAccum, uv).rgb * 4.0;
  s += (texture(uAccum, uv + vec2(px.x, 0.0)).rgb +
        texture(uAccum, uv - vec2(px.x, 0.0)).rgb +
        texture(uAccum, uv + vec2(0.0, px.y)).rgb +
        texture(uAccum, uv - vec2(0.0, px.y)).rgb) * 2.0;
  s += texture(uAccum, uv + px).rgb +
       texture(uAccum, uv - px).rgb +
       texture(uAccum, uv + vec2(px.x, -px.y)).rgb +
       texture(uAccum, uv - vec2(px.x, -px.y)).rgb;
  s /= 16.0;

  s.r = mix(s.r, texture(uAccum, uv + px * 1.15).r, 0.30);
  s.b = mix(s.b, texture(uAccum, uv - px * 1.15).b, 0.30);
  return s;
}
`;

const VERT = HEAD + `
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
`;

// settled drops, stamped permanently into the paper.  blend: dst *= src
const FRAG_BAKE = HEAD + COMMON + `
out vec4 fragColor;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float asp = uRes.x / uRes.y;
  float tooth = paperTooth(uv, asp);
  vec3 T = vec3(1.0);
  for (int i = 0; i < MAXD; i++){
    if (i >= uCount) break;
    vec2 p = vec2((uv.x - uA[i].x) * asp, uv.y - uA[i].y);
    float dens = dropDensity(p, uA[i].z, uA[i].w, uB[i].z, uB[i].w,
                             uB[i].y, uC[i].a, tooth) * uB[i].x;
    if (dens <= 0.0) continue;
    T *= pigment(dens, uC[i].rgb);
  }
  fragColor = vec4(T, 1.0);
}
`;

// evaporation: every stain walks back toward paper white at a fixed rate, clamped at 1
const FRAG_FADE = HEAD + `
out vec4 fragColor;
uniform sampler2D uSrc;
uniform vec2 uRes;
uniform float uAmt;
void main(){
  fragColor = vec4(min(texture(uSrc, gl_FragCoord.xy / uRes).rgb + uAmt, vec3(1.0)), 1.0);
}
`;

const FRAG_MAIN = HEAD + COMMON + `
out vec4 fragColor;
uniform sampler2D uAccum;
uniform float uTime;
uniform vec4 uRing[MAXR];   // xy origin (min-dimension units) | z age | w seed
uniform vec4 uRingB[MAXR];  // x fade (1 while alive, ramped to 0 when retired)
uniform int  uRingCount;
uniform vec3 uInk;          // concentric line ink
uniform vec3 uInkWarm;      // the same ink where it pools

// ---- concentric ink rings (sketch.html) --------------------------------
// signed distance to a ring of radius r, half-thickness w (positive outside the band)
float sdRing(float d, float r, float w){ return abs(d - r) - w; }

float ringDrop(vec2 p, vec2 origin, float age, float seed){
  if (age <= 0.0 || age >= RLIFE) return 0.0;

  vec2 q = p - origin;
  float d0 = length(q);

  // spread decelerates and is bounded, so a drop can never flood the screen
  float R = 0.30 * (1.0 - exp(-age * 0.45));
  if (d0 > R * 1.4 + 0.03) return 0.0;   // reject before paying for atan/noise

  float a = atan(q.y, q.x);

  // organic radial distortion so nothing reads as a perfect circle
  float wob = 1.0
    + 0.045 * sin(a * 5.0  + seed * 6.283)
    + 0.030 * sin(a * 9.0  - seed * 3.141)
    + 0.018 * sin(a * 15.0 + 1.7);
  wob += 0.06 * (vnoise(q * 7.0 + seed * 23.0) - 0.5);
  float d = d0 * wob;

  float ink = 0.0;

  // leading edge: a true annulus, dark only in the band
  float w = 0.006 + 0.004 * exp(-age * 0.5);
  ink += 0.55 * (1.0 - smoothstep(-w, 0.0, sdRing(d, R, w)));

  // trailing rings left behind by the advancing front
  for (int i = 1; i <= 4; i++){
    float fi = float(i);
    float sr = R * (1.0 - 0.16 * fi);
    float sw = 0.0035 + 0.0010 * sin(sr * 40.0 + fi + seed * 6.0);
    ink += (0.26 / fi) * (1.0 - smoothstep(-sw, 0.0, sdRing(d, sr, sw)));
  }

  // faint wash of soaked paper inside the front, kept light so the colour reads through
  ink += 0.09 * (1.0 - smoothstep(R * 0.2, R, d));

  // central pool at the point of impact
  float pr = 0.012 + 0.030 * (1.0 - exp(-age * 0.35));
  ink += 0.62 * (1.0 - smoothstep(pr * 0.45, pr, d));

  float env = smoothstep(0.0, 0.3, age) * (1.0 - smoothstep(RLIFE * 0.35, RLIFE, age));
  return clamp(ink, 0.0, 1.0) * env;
}

// alpha compositing: stays in [0,1] no matter how many rings overlap
float over(float acc, float add){ return acc + (1.0 - acc) * add; }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float asp = uRes.x / uRes.y;
  float tooth = paperTooth(uv, asp);

  // --- cold-press paper ---
  vec3 col = paperColor(uv, asp) * sampleStain(uv, uAccum, uRes);

  // --- drops still wet on the surface ---
  for (int i = 0; i < MAXD; i++){
    if (i >= uCount) break;
    vec2 p = vec2((uv.x - uA[i].x) * asp, uv.y - uA[i].y);
    float dens = dropDensity(p, uA[i].z, uA[i].w, uB[i].z, uB[i].w,
                             uB[i].y, uC[i].a, tooth) * uB[i].x;
    if (dens <= 0.0) continue;
    col *= pigment(dens, uC[i].rgb);
  }

  // --- black concentric lines, laid over the wash ---
  vec2 pr = (uv - 0.5) * vec2(asp, 1.0);   // min-dimension units, y up
  float inkA = 0.0;
  for (int i = 0; i < MAXR; i++){
    if (i >= uRingCount) break;
    float fade = uRingB[i].x;
    if (fade <= 0.0) continue;
    inkA = over(inkA, ringDrop(pr, uRing[i].xy, uRing[i].z, uRing[i].w) * fade);
  }
  if (inkA > 0.0){
    col = mix(col, uInk, inkA);
    col = mix(col, uInkWarm, inkA * 0.3);   // lifted cast where the ink pools
    col += (tooth - 0.5) * inkA * 0.10;     // grain reads through
  }

  // --- finish ---
  // vignette
  col *= 1.0 - 0.16 * pow(length((uv - 0.5) * vec2(asp * 0.95, 1.0)), 2.4);
  // subtle film grain
  col += (hash21(gl_FragCoord.xy + fract(uTime) * 91.7) - 0.5) * 0.014;

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

// ================================================================ gl setup

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  return s;
}

function program(fragSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
    loc[name] = gl.getUniformLocation(p, name);
  }
  return { p, loc };
}

const progMain = program(FRAG_MAIN);
const progBake = program(FRAG_BAKE);
const progFade = program(FRAG_FADE);

gl.bindVertexArray(gl.createVertexArray());

const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
const tex = [null, null];
const fb  = [gl.createFramebuffer(), gl.createFramebuffer()];
let cur = 0, W = 0, H = 0;

function clearPaper(){
  gl.disable(gl.BLEND);
  gl.clearColor(1, 1, 1, 1);
  for (let i = 0; i < 2; i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb[i]);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(2, Math.round(window.innerWidth * dpr));
  H = Math.max(2, Math.round(window.innerHeight * dpr));
  canvas.width = W; canvas.height = H;

  for (let i = 0; i < 2; i++){
    if (tex[i]) gl.deleteTexture(tex[i]);
    tex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, hasFloat ? gl.RGBA16F : gl.RGBA8, W, H, 0, gl.RGBA,
                  hasFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex[i], 0);
  }
  gl.viewport(0, 0, W, H);
  clearPaper();
}
window.addEventListener('resize', resize);
resize();

// ================================================================ droplets

// Source palettes.  These are re-cast through THEME below; edit THEME, not these.
const PALETTE = [
  [0.93, 0.10, 0.52], // magenta
  [0.86, 0.08, 0.68], // fuchsia
  [0.82, 0.06, 0.30], // crimson
  [0.55, 0.12, 0.78], // purple
  [0.38, 0.16, 0.86], // violet
  [0.16, 0.34, 0.92], // indigo
  [0.06, 0.62, 0.92], // cyan
  [0.04, 0.78, 0.76], // teal
  [0.10, 0.74, 0.48], // viridian
  [0.98, 0.48, 0.06], // orange
  [0.96, 0.24, 0.13], // vermilion
  [0.99, 0.70, 0.10], // amber
  [0.15, 0.85, 0.55], // mint
  [0.20, 0.90, 0.80], // teal bright
  [0.85, 0.10, 0.65], // fuchsia deep
  [0.10, 0.35, 0.90], // indigo deep
];

// spiffy2's muted pigment wheel: big stains stay quieter than the splashes
const STAIN_PALETTE = [
  [0.16, 0.26, 0.56], // indigo
  [0.10, 0.50, 0.55], // teal
  [0.60, 0.20, 0.50], // magenta
  [0.78, 0.22, 0.30], // crimson
  [0.85, 0.55, 0.15], // amber
  [0.16, 0.45, 0.30], // forest
];

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const TAU = Math.PI * 2;

function rgb2hsv(c){
  const r = c[0], g = c[1], b = c[2];
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 1e-6){
    if (mx === r)      h = ((g - b) / d + 6) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else               h = (r - g) / d + 4;
    h /= 6;
  }
  return [h, mx > 1e-6 ? d / mx : 0, mx];
}

function hsv2rgb(h, s, v){
  h = ((h % 1) + 1) % 1;
  s = clamp01(s); v = clamp01(v);
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  switch (i % 6){
    case 0:  return [v, t, p];
    case 1:  return [q, v, p];
    case 2:  return [p, v, t];
    case 3:  return [p, q, v];
    case 4:  return [t, p, v];
    default: return [v, p, q];
  }
}

// Pull a set of values toward `center`, keeping their relative spacing intact
// but squeezing the widest deviation down to `spread`.
function tighten(vals, center, spread){
  let mean = 0;
  for (let i = 0; i < vals.length; i++) mean += vals[i];
  mean /= vals.length;
  let widest = 0;
  for (let i = 0; i < vals.length; i++) widest = Math.max(widest, Math.abs(vals[i] - mean));
  const k = widest > 1e-6 ? spread / widest : 0;
  return vals.map(v => center + (v - mean) * k);
}

// Re-cast a palette into the theme's hue family.  Hues are handled on the
// circle, so a palette straddling the red seam still compresses correctly.
function harmonize(palette, o){
  const hsv = palette.map(rgb2hsv);
  let sx = 0, sy = 0;
  for (let i = 0; i < hsv.length; i++){ sx += Math.cos(hsv[i][0] * TAU); sy += Math.sin(hsv[i][0] * TAU); }
  const meanH = Math.atan2(sy, sx) / TAU;
  const dh = hsv.map(c => { const d = c[0] - meanH; return d - Math.round(d); });   // wrap to [-.5,.5]

  const hs = tighten(dh, 0, o.hueSpread);
  const ss = tighten(hsv.map(c => c[1]), o.sat, o.satSpread);
  const vs = tighten(hsv.map(c => c[2]), o.val, o.valSpread);
  return hsv.map((_, i) => hsv2rgb(THEME.hue + o.hueShift + hs[i], ss[i], vs[i]));
}

const SPLASH_COLS = harmonize(PALETTE, {
  hueShift: 0, hueSpread: THEME.hueSpread,
  sat: THEME.sat, satSpread: THEME.satSpread,
  val: THEME.val, valSpread: THEME.valSpread
});
const STAIN_COLS = harmonize(STAIN_PALETTE, {
  hueShift: THEME.stainHueShift, hueSpread: THEME.hueSpread * 0.8,
  sat: THEME.stainSat, satSpread: THEME.stainSatSpread,
  val: THEME.stainVal, valSpread: THEME.stainValSpread
});

const LINE_INK  = hsv2rgb(THEME.hue + THEME.lineHueShift, THEME.lineSat, THEME.lineVal);
const LINE_WARM = hsv2rgb(THEME.hue + THEME.lineHueShift, THEME.lineSat * 0.8,
                          THEME.lineVal + THEME.lineWarm);

const pick = () => SPLASH_COLS[(Math.random() * SPLASH_COLS.length) | 0];
const pickStain = () => STAIN_COLS[(Math.random() * STAIN_COLS.length) | 0];

// Per-drop wobble now happens in HSV, so a jittered drop stays in the family
// instead of sliding off-hue the way independent RGB nudges did.
function inkColor(base){
  const c = rgb2hsv(base || pick());
  return hsv2rgb(c[0] + rnd(-THEME.jitterHue, THEME.jitterHue),
                 c[1] + rnd(-THEME.jitterSat, THEME.jitterSat),
                 c[2] + rnd(-THEME.jitterVal, THEME.jitterVal));
}

const drops = [];
const queue = [];                 // splashes waiting their turn
let time = 0, nextSpawn = 0, nextStain = 4.0;
let paused = false;
let frameCount = 0, lastFpsTime = 0, fps = 0;

function schedule(delay, o){ queue.push({ at: time + delay, o: o || {} }); }

function spawn(o){
  o = o || {};
  const soft = o.soft ? 1 : 0;
  const x = o.x !== undefined ? o.x : rnd(0.04, 0.96);
  const y = o.y !== undefined ? o.y : rnd(0.06, 0.94);
  drops.push({
    baseX: x,
    baseY: y,
    rMax: o.rMax !== undefined ? o.rMax
        : (Math.random() < 0.14 ? rnd(0.13, 0.20) : rnd(0.045, 0.115)),
    hitT: time,
    seed: rnd(0, 90),
    col: o.col || inkColor(o.base),
    soft,
    fall: o.fall || 0,                // seconds spent in the air before soaking
    fromY: o.fromY !== undefined ? o.fromY : y,
    fragMax: o.frag !== undefined ? o.frag : rnd(0.0, 0.18),
    tendrilMax: o.tendrilMax !== undefined ? o.tendrilMax : rnd(0.30, 0.85),
    aspect: o.aspect !== undefined ? o.aspect : 1.0,   // permanent squash bias
    bake: o.bake !== undefined ? o.bake : BAKE_AGE,
    load: o.load !== undefined ? o.load : rnd(0.85, 1.35),   // pigment carried
    sag: o.sag !== undefined ? o.sag : rnd(0.004, 0.020),    // gravity pull while settling
    splat: rnd(0.18, 0.36),           // how flat the initial impact spreads it
    wobW: rnd(12.0, 19.0),            // settling wobble rate
    satellites: o.satellites !== undefined ? o.satellites
              : (Math.random() < 0.55 ? 1 + ((Math.random() * 2) | 0) : 0),
    splashed: false,
    x: x, y: y, r: 0, squash: 1, tendril: 0, frag: 0, strength: 0
  });
}

function cluster(x, y){
  const base = pick(), alt = pick();
  const n = 5 + ((Math.random() * 5) | 0);
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283);
    const rad = Math.pow(Math.random(), 0.65) * 0.16;
    schedule(i === 0 ? 0 : rnd(0.02, 0.26), {
      x: clamp01(x + Math.cos(a) * rad),
      y: clamp01(y + Math.sin(a) * rad * 0.75),
      rMax: i === 0 ? rnd(0.09, 0.155) : rnd(0.025, 0.095),
      base: Math.random() < 0.7 ? base : alt
    });
  }
}

// spiffy.html: an impact that shatters outward into small, torn, elongated shards
function splash(x, y){
  const base = pick(), alt = pick();
  schedule(0, { x: clamp01(x), y: clamp01(y), rMax: rnd(0.06, 0.115),
                base, frag: rnd(0.28, 0.50), tendrilMax: rnd(0.55, 1.05), satellites: 0 });

  const n = 8 + ((Math.random() * 8) | 0);
  for (let i = 0; i < n; i++){
    const a = (i / n) * 6.283 + rnd(-0.30, 0.30);
    const dist = 0.05 + Math.pow(Math.random(), 0.55) * 0.24;
    schedule(rnd(0.0, 0.20), {
      x: clamp01(x + Math.cos(a) * dist),
      y: clamp01(y + Math.sin(a) * dist * 0.82),
      rMax: rnd(0.008, 0.042),
      base: Math.random() < 0.72 ? base : alt,
      frag: rnd(0.55, 1.0),                 // torn to pieces at the rim
      tendrilMax: rnd(0.70, 1.40),          // long capillary fingers off each shard
      aspect: rnd(0.45, 1.85),              // flung shards are not round
      load: rnd(0.70, 1.15),
      bake: rnd(1.6, 2.6),                  // small and thin, so they dry fast
      satellites: 0
    });
  }
}

// spiffy2.html: a fat drop falls in from off-screen, lands, and soaks out huge
function bigStain(){
  spawn({
    x: rnd(0.10, 0.90),
    y: rnd(0.18, 0.78),
    rMax: rnd(0.22, 0.42),
    base: pickStain(),
    soft: true,
    fall: rnd(0.8, 1.4),
    fromY: 1.14,
    load: rnd(0.46, 0.80),
    sag: rnd(0.010, 0.030),
    bake: rnd(8.0, 11.0),
    satellites: 0,
    frag: 0
  });
}

function stainCount(){
  let n = 0;
  for (let i = 0; i < drops.length; i++) if (drops[i].soft) n++;
  return n;
}

// returns seconds since the drop landed (negative while it is still falling)
function updateDrop(d){
  const a = time - d.hitT;

  if (d.fall > 0 && a < d.fall){
    const ft = a / d.fall;
    d.x = d.baseX + Math.sin(ft * 5.0 + d.seed) * 0.008;
    d.y = d.fromY + (d.baseY - d.fromY) * ft * ft;   // accelerating like gravity
    d.r = d.rMax * (0.10 + 0.10 * ft);
    d.squash = 2.10 - 0.90 * ft;                     // stretched streak, relaxing on impact
    d.tendril = 0;
    d.frag = 0;
    d.strength = 0.45 * d.load;
    return a - d.fall;
  }

  const s = a - d.fall;
  d.x = d.baseX;

  if (!d.splashed){
    d.splashed = true;
    for (let i = 0; i < d.satellites; i++){
      const ang = rnd(0, 6.283), dist = d.rMax * rnd(1.3, 2.8);
      schedule(rnd(0.03, 0.14), {                       // flung off, landing just after
        x: clamp01(d.baseX + Math.cos(ang) * dist),
        y: clamp01(d.baseY + Math.sin(ang) * dist * 0.8),
        rMax: d.rMax * rnd(0.10, 0.30), col: d.col, satellites: 0
      });
    }
  }

  const e = 1.0 - Math.exp(-s * (d.soft ? 0.55 : 2.2));   // settle curve: slow soak / fast bloom

  if (d.soft){
    d.r = d.rMax * (0.16 + 0.84 * e);
    d.squash = d.aspect * (1.0 - 0.12 * Math.exp(-s * 1.2));
    d.tendril = 0;
    d.frag = 0;
    d.strength = (0.35 + 0.65 * e) * d.load;
  } else {
    d.r = d.rMax * (0.34 + 0.66 * e) * (1.0 + 0.11 * Math.exp(-s * 3.2) * Math.sin(s * 14.0));
    d.squash = d.aspect * (1.0 - d.splat * Math.exp(-s * 4.5) * Math.cos(s * d.wobW));
    d.tendril = d.tendrilMax * (0.22 + 0.78 * e);
    d.frag = d.fragMax * (0.35 + 0.65 * e);            // shards tear apart as they spread
    d.strength = (0.55 + 0.55 * e) * d.load;
  }
  d.y = d.baseY - d.sag * e;
  return s;
}

// ================================================================ concentric rings

const rings = [];
let nextRing = 1.2, lastRingClick = -99;

// 1 while the ring is alive, easing to 0 across RING_RETIRE once it is retired
function ringFade(r){
  if (!r.retired) return 1.0;
  const k = (time - r.retired) / RING_RETIRE;
  return k >= 1.0 ? 0.0 : 1.0 - k * k * (3.0 - 2.0 * k);
}

function addRing(px, py){
  // Never yank a visible ring: retire the oldest and let it fade in a spare slot.
  let live = 0;
  for (let i = 0; i < rings.length; i++) if (!rings[i].retired) live++;
  if (live >= RING_CAP){
    let oldest = -1;
    for (let i = 0; i < rings.length; i++){
      if (!rings[i].retired && (oldest < 0 || rings[i].t0 < rings[oldest].t0)) oldest = i;
    }
    if (oldest >= 0) rings[oldest].retired = time;
  }
  // click spam can still outrun the spare slots; drop the faintest, never a fresh one
  while (rings.length >= MAXR){
    let faint = 0;
    for (let i = 1; i < rings.length; i++){
      if (ringFade(rings[i]) < ringFade(rings[faint])) faint = i;
    }
    rings.splice(faint, 1);
  }
  rings.push({ x: px, y: py, seed: Math.random(), t0: time, retired: 0 });
}

function autoRing(){
  const halfX = 0.5 * (W / H);
  addRing(rnd(-halfX, halfX) * 0.85, rnd(-0.5, 0.5) * 0.85);
}

// ================================================================ render

const bufA = new Float32Array(MAXD * 4);
const bufB = new Float32Array(MAXD * 4);
const bufC = new Float32Array(MAXD * 4);
const bufR = new Float32Array(MAXR * 4);
const bufRB = new Float32Array(MAXR * 4);

function pack(list){
  const n = Math.min(list.length, MAXD);
  for (let i = 0; i < n; i++){
    const d = list[i], o = i * 4;
    bufA[o] = d.x;        bufA[o+1] = d.y;      bufA[o+2] = d.r;      bufA[o+3] = d.seed;
    bufB[o] = d.strength; bufB[o+1] = d.frag;   bufB[o+2] = d.squash; bufB[o+3] = d.tendril;
    bufC[o] = d.col[0];   bufC[o+1] = d.col[1]; bufC[o+2] = d.col[2]; bufC[o+3] = d.soft;
  }
  return n;
}

function packRings(){
  const n = Math.min(rings.length, MAXR);
  for (let i = 0; i < n; i++){
    const r = rings[i], o = i * 4;
    bufR[o] = r.x; bufR[o+1] = r.y; bufR[o+2] = time - r.t0; bufR[o+3] = r.seed;
    bufRB[o] = ringFade(r);
  }
  return n;
}

function uploadDrops(pr, n){
  gl.uniform4fv(pr.loc.uA, bufA);
  gl.uniform4fv(pr.loc.uB, bufB);
  gl.uniform4fv(pr.loc.uC, bufC);
  gl.uniform1i(pr.loc.uCount, n);
}

let last = performance.now() / 1000;
let pendingFade = 0;

function frame(now){
  now /= 1000;
  const dt = Math.min(now - last, 0.05);
  last = now;

  // FPS counter
  frameCount++;
  if (now - lastFpsTime >= 1.0) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('stats').textContent =
      `drops: ${drops.length} | rings: ${rings.length} | queue: ${queue.length} | fps: ${fps} | ${paused ? 'PAUSED' : 'running'}`;
  }

  // update, then split into still-wet (drawn live) and settled (stamped down)
  const wet = [], bake = [];

  if (!paused) {
    time += dt;

    for (let i = queue.length - 1; i >= 0; i--){
      if (time >= queue[i].at){ spawn(queue[i].o); queue.splice(i, 1); }
    }
    if (time > nextSpawn){
      nextSpawn = time + rnd(AUTO_SPAWN_MIN, AUTO_SPAWN_MAX);
      spawn();
    }
    if (time > nextStain){
      nextStain = time + rnd(STAIN_MIN, STAIN_MAX);
      if (stainCount() < STAIN_ALIVE) bigStain();
    }
    if (time > nextRing){
      nextRing = time + RING_STAGGER * rnd(0.7, 1.4);
      autoRing();
    }
    for (let i = rings.length - 1; i >= 0; i--){
      const r = rings[i];
      if (time - r.t0 >= RING_LIFE || (r.retired && time - r.retired >= RING_RETIRE)) {
        rings.splice(i, 1);
      }
    }

    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      if (updateDrop(d) >= d.bake){
        bake.push(d);
        drops.splice(i, 1);
      } else {
        wet.push(d);
      }
    }
    // hard cap: retire the oldest wet drops (newest are first, having iterated backwards)
    while (wet.length > MAXD){
      const d = wet.pop();
      const k = drops.indexOf(d);
      if (k >= 0) drops.splice(k, 1);
      bake.push(d);
    }
  }

  gl.disable(gl.DEPTH_TEST);
  gl.viewport(0, 0, W, H);

  // evaporation: a fully saturated channel reaches paper white in FADE_TIME seconds
  if (!paused) {
    pendingFade += dt / FADE_TIME;
    if (pendingFade > (hasFloat ? 0.0 : 0.006)){
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb[cur ^ 1]);
      gl.disable(gl.BLEND);
      gl.useProgram(progFade.p);
      gl.uniform2f(progFade.loc.uRes, W, H);
      gl.uniform1f(progFade.loc.uAmt, pendingFade);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
      gl.uniform1i(progFade.loc.uSrc, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      cur ^= 1;
      pendingFade = 0;
    }
  }

  // stamp settled drops: dst *= transmittance
  if (bake.length){
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb[cur]);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
    gl.useProgram(progBake.p);
    gl.uniform2f(progBake.loc.uRes, W, H);
    uploadDrops(progBake, pack(bake));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    for (let i = MAXD; i < bake.length; i++) drops.push(bake[i]);   // overflow waits a frame
  }

  // composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(progMain.p);
  gl.uniform2f(progMain.loc.uRes, W, H);
  gl.uniform1f(progMain.loc.uTime, time);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
  gl.uniform1i(progMain.loc.uAccum, 0);
  uploadDrops(progMain, pack(wet));
  gl.uniform3f(progMain.loc.uInk, LINE_INK[0], LINE_INK[1], LINE_INK[2]);
  gl.uniform3f(progMain.loc.uInkWarm, LINE_WARM[0], LINE_WARM[1], LINE_WARM[2]);
  const nRings = packRings();
  gl.uniform4fv(progMain.loc.uRing, bufR);
  gl.uniform4fv(progMain.loc.uRingB, bufRB);
  gl.uniform1i(progMain.loc.uRingCount, nRings);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}

// ================================================================ input

const hint = document.getElementById('hint');

canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  const ux = (e.clientX - r.left) / r.width;
  const uy = 1.0 - (e.clientY - r.top) / r.height;
  cluster(ux, uy);
  splash(ux, uy);
  if (time - lastRingClick > RING_CLICK_GAP){
    lastRingClick = time;
    addRing((ux - 0.5) * (W / H), uy - 0.5);
  }
  hint.classList.add('gone');
});

window.addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C'){
    drops.length = 0; queue.length = 0; rings.length = 0; clearPaper();
  }
  if (e.key === ' '){
    paused = !paused;
    if (!paused) last = performance.now() / 1000; // reset dt on resume
  }
});

// Initial burst
for (let i = 0; i < INITIAL_BURST; i++) {
  setTimeout(() => spawn(), i * 180);
}
setTimeout(() => bigStain(), 900);

requestAnimationFrame(() => hint.classList.add('gone'));
requestAnimationFrame(frame);
</script>
</body>
</html>
